<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>STATE</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;}
html,body{
  margin:0;
  width:100%;
  height:100%;
  font-family:Inter,-apple-system,BlinkMacSystemFont;
  overflow:hidden;
  transition:background 1.2s ease;
}

body{
  background:
    radial-gradient(1000px 700px at 20% 20%, #e8b8ff, transparent 60%),
    radial-gradient(900px 700px at 80% 80%, #dce7ff, transparent 60%),
    radial-gradient(700px 500px at 50% 40%, #fff0e0, transparent 60%),
    #f6f7fb;
}

#safe{
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  height:100%;
}

#app{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

#card{
  background:#fff;
  border-radius:32px;
  padding:64px 40px;
  width:82%;
  max-width:360px;
  min-height:260px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  box-shadow:0 20px 60px rgba(0,0,0,.08);
  transition:.6s cubic-bezier(.4,0,.2,1);
  animation: float 6s ease-in-out infinite;
  transform-style:preserve-3d;
}

@keyframes float{
  0%{transform:translateY(0);}
  50%{transform:translateY(-6px);}
  100%{transform:translateY(0);}
}

#card.glow{
  box-shadow:0 40px 120px rgba(0,0,0,.15);
}

#card.flip{
  animation: flip .7s ease;
}

@keyframes flip{
  0%{transform:rotateY(0deg) scale(1);}
  40%{transform:rotateY(15deg) scale(.96);}
  70%{transform:rotateY(-10deg) scale(1.03);}
  100%{transform:rotateY(0deg) scale(1);}
}

#draw{
  margin-top:32px;
  padding:14px 52px;
  border-radius:999px;
  border:1px solid rgba(0,0,0,.15);
  background:#fff;
  color:#111;
  letter-spacing:4px;
  font-size:12px;
}

#hint{
  margin-top:12px;
  font-size:11px;
  color:#666;
}

.tabs{
  position:absolute;
  bottom:env(safe-area-inset-bottom);
  width:100%;
  padding:20px 32px;
  display:flex;
  justify-content:space-between;
  font-size:12px;
  color:#777;
}
.tab{cursor:pointer;}
.tab.active{color:#111;}
</style>
</head>

<body>
<div id="safe">
<div id="app">

  <div id="card">DRAW</div>
  <button id="draw" onclick="draw()">DRAW</button>

  <div class="tabs">
    <div class="tab active" onclick="setPool('break')">BREAK</div>
    <div class="tab" onclick="setPool('move')">MOVE</div>
    <div class="tab" onclick="setPool('ping')">PING</div>
    <div class="tab" onclick="setPool('soft')">SOFT</div>
  </div>

</div>
</div>

<audio id="sound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_29c3b0b38c.mp3?filename=soft-click-124461.mp3"></audio>

<script>
let current="break";

const backgrounds={
  break:`radial-gradient(1000px 700px at 20% 20%, #e8b8ff, transparent 60%),radial-gradient(900px 700px at 80% 80%, #dcd6ff, transparent 60%),#f4efff`,
  move:`radial-gradient(1000px 700px at 20% 20%, #bfe0ff, transparent 60%),radial-gradient(900px 700px at 80% 80%, #e0f1ff, transparent 60%),#f1f8ff`,
  ping:`radial-gradient(1000px 700px at 20% 20%, #ffd9b0, transparent 60%),radial-gradient(900px 700px at 80% 80%, #fff0d9, transparent 60%),#fff7ed`,
  soft:`radial-gradient(1000px 700px at 20% 20%, #bff0d5, transparent 60%),radial-gradient(900px 700px at 80% 80%, #e2f8ee, transparent 60%),#f2fbf7`
};

const pools={
  break:[
    {t:"BREAK — Disrupt the loop",c:"停下你正在做的事\n站起来，走到另一个房间"},
    {t:"BREAK — Break the script",c:"给一个你很久没联系的人\n发一句：我刚刚突然想到你"},
    {t:"BREAK — Change the rhythm",c:"把你现在的姿势换掉\n坐、站、躺，随便"},
    {t:"BREAK — Loud declaration", c:"在公共场合大喊：我是最棒的！"},
    {t:"BREAK — Irregular performance", c:"在地铁上开始自言自语，放声大笑"},
    {t:"BREAK — Talking loud", c:"走在街上给陌生人打招呼：‘你好，好久不见’"},
    {t:"BREAK — Breaking the norm", c:"去街头唱歌，虽然没有音准"}
  ],
  move:[
    {t:"MOVE — Shift the body",c:"拉伸你的肩膀\n像刚醒来一样"},
    {t:"MOVE — Take one step",c:"走到最近的窗前\n看外面 30 秒"},
    {t:"MOVE — Relocate",c:"离开你现在的空间\n两分钟"},
    {t:"MOVE — Travel somewhere new", c:"今天去一个你从没去过的地方"},
    {t:"MOVE — Changing the path", c:"选择你从未走过的那条小路"},
    {t:"MOVE — Active exploration", c:"随意漫步，随时停下，随时走动"},
    {t:"MOVE — New route", c:"改变你回家的路线，去一个新的地方"}
  ],
  ping:[
    {t:"PING — Ask the quiet question",c:"你现在在逃避什么？"},
    {t:"PING — Name it",c:"如果你必须说一句真话\n那会是什么？"},
    {t:"PING — Check in",c:"你现在真正想要的是什么？"},
    {t:"PING — Self-awareness", c:"你意识到最近自己总是拖延，为什么？"},
    {t:"PING — Personal check", c:"感受自己内心的疲倦，是什么在束缚你？"},
    {t:"PING — Why wait?", c:"你为什么还在等待一个机会？你准备好了吗？"},
    {t:"PING — Deep dive", c:"你为自己的未来做了哪些具体决定？"}
  ],
  soft:[
    {t:"SOFT — Lower the noise",c:"去喝一杯水\n慢慢地"},
    {t:"SOFT — Be gentle",c:"把手机放下 30 秒\n什么都不做"},
    {t:"SOFT — Ease the system",c:"闭上眼睛\n深呼吸三次"},
    {t:"SOFT — Small kindness", c:"给自己买一件小而美的物品"},
    {t:"SOFT — Positive talk", c:"对着镜子微笑，并对自己说：“我很棒！”"},
    {t:"SOFT — Self-care", c:"躺在床上，闭上眼睛，感受片刻安宁"},
    {t:"SOFT — Gentle self-praise", c:"给自己写一个简短的感谢信"}
  ]
};

function setPool(p){
  current=p;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  event.target.classList.add("active");
  document.body.style.background=backgrounds[p];
  document.getElementById("card").innerText="DRAW";
}

function draw(){
  const arr=pools[current];
  const c=arr[Math.floor(Math.random()*arr.length)];
  const card=document.getElementById("card");

  document.getElementById("sound").play();
  if(navigator.vibrate)navigator.vibrate(20);

  card.classList.remove("glow","flip");
  void card.offsetWidth;
  card.classList.add("flip");

  setTimeout(()=>{
    card.innerHTML=`<div style="font-family:'Playfair Display';font-size:14px;opacity:.5;margin-bottom:18px">${c.t}</div>
    <div style="font-size:18px;line-height:1.6;white-space:pre-line">${c.c}</div>`;
    card.classList.add("glow");
  },350);
}
</script>

</body>
</html>
